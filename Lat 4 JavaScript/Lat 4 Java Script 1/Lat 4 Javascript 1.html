<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Lat Javascript 01</title>
    </head>

    <body>
        <h1>Lat Javascript 01 Sean 20242039</h1>

        <p id="inputnum1"></p>
        <p id="inputnum2"></p>
        <p id="inputnum3"></p>
        <p id="inputnum4"></p>
        
        <button onclick="InputFunc1()">START</button>

        <script>
            let numput1, numput2, numAnswer;
            let input1, input2, inputOp;
            function InputFunc1() {
                input1 = prompt("Input First Number!");
                if (input1 != null) {
                    numput1 = Number(input1);
                    if (Number.isNaN(numput1)){
                        return clearDisp("Wrong Input!");
                    } else {
                        document.getElementById("inputnum1").innerHTML = "Number 1: " + numput1;
                        InputFunc2();
                    }  
                } else {
                    return clearDisp("Canceled!");
                }
            }

            function InputFunc2() {
                input2 = prompt("Input Second Number!");
                if (input2 != null) {
                    numput2 = Number(input2);
                    if (Number.isNaN(numput2)){
                        return clearDisp("Wrong Input!");
                    } else {
                        document.getElementById("inputnum2").innerHTML = "Number 2: " + numput2;
                        InputFunc3();
                    }
                } else {
                    return clearDisp("Canceled!");
                }
            }

            function InputFunc3() {
                inputOp = prompt("Input Operand(+, -, *, /)!");
                if (inputOp != null) {
                    if (inputOp == "+" || inputOp == "-" || inputOp == "*" || inputOp == "/") {
                        document.getElementById("inputnum3").innerHTML = "Operand: " + inputOp;
                        InputFunc4();
                    } else {
                        return clearDisp("Wrong Input!");
                    }    
                } else {
                    return clearDisp("Canceled!");
                }
            }

            function InputFunc4() {
                switch (inputOp) {
                    case "+":
                        numAnswer = numput1 + numput2;
                    break;
                    case "-":
                        numAnswer = numput1 - numput2;
                    break;
                    case "*":
                        numAnswer = numput1 * numput2;
                    break;
                    case "/":
                        numAnswer = numput1 / numput2;
                    break;
                }
                document.getElementById("inputnum4").innerHTML = "Result: " + numput1 + " " + inputOp + " " + numput2 + " : " + numAnswer;
                window.alert("Result: " + numAnswer);
            }
            
            function clearDisp(errorMessage){
                document.getElementById("inputnum1").innerHTML = errorMessage;
                document.getElementById("inputnum2").innerHTML = "";
                document.getElementById("inputnum3").innerHTML = "";
                document.getElementById("inputnum4").innerHTML = "";
            }
        </script>

    </body>
</html>
