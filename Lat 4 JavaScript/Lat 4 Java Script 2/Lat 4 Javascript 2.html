<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Lat Javascript 02</title>
    </head>

    <body>
        <h1>Lat Javascript 02 Sean 20242039</h1>

        <input id="task" placeholder="Add Task">

        <button onclick="addTask()">Add</button>
        
        <ul id="list"></ul>
        
        <button onclick="clearAll()">Clear All</button>
        
        <p id="saving"></p>

        <script>
            let tasks = [];

            function displayTask() {
                let html = "";
                for (let i = 0; i < tasks.length; i++) {
                    html += "<li>" + tasks[i] +
                    " <button onclick='removeTasks(" + i + ")'>x</button></li>";
                }
                document.getElementById("list").innerHTML = html;
            }

            function addTask() {
                let taskInput = document.getElementById("task");
                let text = taskInput.value;
                if (text === "") {
                    window.alert("Empty Text!");
                    return;
                }
                tasks.push(text);
                taskInput.value = "";
                saveTasks();
                displayTask();
            }

            function removeTasks(i) {
                tasks.splice(i, 1);
                saveTasks();
                displayTask();
            }

            function clearAll() {
                tasks = [];
                saveTasks();
                displayTask();
            }

            function saveTasks() {
                localStorage.setItem("tasks", JSON.stringify(tasks));
                document.getElementById("saving").innerHTML = "Saved!";
            }
            
            function loadTasks() {
                let saved = localStorage.getItem("tasks");
                if (saved !== null) {
                    tasks = JSON.parse(saved);
                }
            }

            loadTasks();
            displayTask();

        </script>

    </body>

</html>
